<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Todo Lists</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="app-brand">
      <span class="brand-icon">✅</span>
      <span class="brand-name">Visual Lists</span>
    </div>
  </div>

  <div class="sidebar-lists" id="sidebar-lists">
    <!-- List items rendered here -->
  </div>

  <div class="sidebar-footer">
    <button class="new-list-btn" id="new-list-btn">
      <span class="new-list-plus">+</span> New List
    </button>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main">

  <!-- Empty state -->
  <div class="main-empty" id="main-empty">
    <div class="empty-icon">📋</div>
    <h2 class="empty-title">No list selected</h2>
    <p class="empty-sub">Create a new list to get started</p>
    <button class="create-first-btn" id="create-first-btn">Create your first list</button>
  </div>

  <!-- List view -->
  <div class="list-view" id="list-view" hidden>

    <div class="list-header">
      <div class="list-header-left">
        <input class="list-title-input" id="list-title-input" type="text" placeholder="List name..." spellcheck="false" />
        <div class="list-meta" id="list-meta"></div>
      </div>
      <button class="delete-list-btn" id="delete-list-btn" title="Delete this list">🗑 Delete List</button>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar-wrap" id="progress-bar-wrap">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Todos -->
    <div class="todos-container" id="todos-container">
      <!-- Todo items rendered here -->
    </div>

    <!-- Add todo input -->
    <div class="add-todo-area">
      <input
        class="add-todo-input"
        id="add-todo-input"
        type="text"
        placeholder="What do you need to do? Press Enter to add with image..."
        autocomplete="off"
        spellcheck="true"
      />
      <button class="add-todo-btn" id="add-todo-btn">Add</button>
    </div>

  </div>

</main>

<script src="app.js"></script>
</body>
</html>
